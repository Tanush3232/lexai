version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# Shared env interpolation helper — all services read from .env at repo root.
# Copy .env.example → .env and fill in your GOOGLE_API_KEY before starting.
# ──────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  env_file:
    - ../.env

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: lexai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexai
      POSTGRES_PASSWORD: lexai
      POSTGRES_DB: lexai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lexai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: lexai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: lexai_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: lexai_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/lexai_neo4j
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lexai_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── Application services ───────────────────────────────────────────────────

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: lexai_api
    restart: unless-stopped
    <<: *common-env
    environment:
      - POSTGRES_URL=postgresql+asyncpg://lexai:lexai@postgres:5432/lexai
      - POSTGRES_SYNC_URL=postgresql://lexai:lexai@postgres:5432/lexai
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - NEO4J_URI=bolt://neo4j:7687
      # Inside Docker: use service name 'minio' on port 9000
      - MINIO_ENDPOINT=http://minio:9000
      # Presigned URLs must use LAN IP so browsers outside Docker can open files
      - MINIO_PUBLIC_URL=http://${NETWORK_IP:-localhost}:9000
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CORS_ORIGINS=["http://localhost:3000","http://${NETWORK_IP:-localhost}:3000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/workers/Dockerfile
    container_name: lexai_worker
    restart: unless-stopped
    <<: *common-env
    environment:
      - POSTGRES_URL=postgresql+asyncpg://lexai:lexai@postgres:5432/lexai
      - POSTGRES_SYNC_URL=postgresql://lexai:lexai@postgres:5432/lexai
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - NEO4J_URI=bolt://neo4j:7687
      # Inside Docker: use service name 'minio' on port 9000
      - MINIO_ENDPOINT=http://minio:9000
      # Presigned URLs must use LAN IP so browsers outside Docker can open files
      - MINIO_PUBLIC_URL=http://${NETWORK_IP:-localhost}:9000
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is baked into the browser bundle at build time.
        # Must be the LAN IP (not localhost) so browser clients outside Docker can reach the API.
        NEXT_PUBLIC_API_URL: http://${NETWORK_IP:-localhost}:8000
    container_name: lexai_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  es_data:
  neo4j_data:
  neo4j_logs:
  minio_data:

