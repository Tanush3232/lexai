worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Increase body size for PDF/document uploads (legal acts can be large)
    client_max_body_size 100M;

    # Proxy buffer tuning for large legal document uploads
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # ── Upstream services (Docker container names as DNS) ─────────────────────
    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:8000;
    }

    server {
        listen 80;
        server_name staging.lexai.zuarione.com;

        # ── Frontend (Next.js) ────────────────────────────────────────────────
        location / {
            proxy_pass         http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Backend API (FastAPI) ─────────────────────────────────────────────
        # ROUTING:
        #   Browser sends:   GET /api/v1/auth/token
        #   Nginx passes:    http://api:8000/api/v1/auth/token  (path unchanged ✅)
        #   FastAPI expects: /api/v1/auth/token  (registered in main.py)
        location /api/ {
            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 60s;
            # ── SSE (Server-Sent Events) support — required for /api/v1/web-search/search
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── API Docs (Swagger UI) ─────────────────────────────────────────────
        location /api/docs {
            proxy_pass http://api_upstream/api/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://api_upstream/openapi.json;
            proxy_set_header Host $host;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /api/health {
            proxy_pass http://api_upstream/api/health;
            proxy_set_header Host $host;
        }
    }
}

# ── MinIO ─────────────────────────────────────────────────────────────────────
# MinIO runs on port 9000 (exposed directly in docker-compose.yml).
# Browser presigned PDF links use: http://staging.lexai.zuarione.com:9000
# No Nginx config needed — Docker handles port 9000 → minio:9000 directly.
