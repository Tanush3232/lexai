worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Increase body size for document uploads
    client_max_body_size 100M;

    # Upstream services
    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # ── Frontend (Next.js) ─────────────────────────────────────────────────
        location / {
            proxy_pass         http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Backend API (FastAPI) ──────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── API Docs (optional, remove in strict production) ──────────────────
        location /docs {
            proxy_pass http://api_upstream/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://api_upstream/openapi.json;
            proxy_set_header Host $host;
        }
    }
}

# ── MinIO — separate server block on port 9000 ────────────────────────────────
# Browser presigned URLs point to http://<SERVER_IP>:9000
# Port 9000 is exposed in docker-compose.yml and passes directly to minio
